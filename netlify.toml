[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

[dev]
  command = "npm run dev"
  targetPort = 5173
  port = 8888

# SPA: qualquer rota que não seja arquivo ou função cai no index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
